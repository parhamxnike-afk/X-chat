<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Chat | پیام‌رسان خصوصی</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
.app{width:100%;max-width:950px;min-height:600px;background:#111c30;border:1px solid #263954;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #0008}
header{background:#172b49;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:23px;font-weight:bold;color:#55aaff}
.small{color:#a9bdd7;font-size:12px;margin-top:5px}
button{border:0;border-radius:10px;padding:12px 16px;background:#2785ed;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #344a68;border-radius:10px;background:#0b1729;color:white;font-size:14px}
.auth{max-width:400px;margin:35px auto;padding:20px}
.auth h2{text-align:center}
.auth button{width:100%;margin-top:10px}
#appArea{display:none}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:540px}
.sidebar{background:#14233a;padding:15px;border-left:1px solid #263954}
.sidebar h3{font-size:15px}
#users{max-height:440px;overflow:auto}
.user{padding:13px;margin:7px 0;background:#203653;border-radius:10px;cursor:pointer}
.user.active,.user:hover{background:#1769bd}
.chat{display:flex;flex-direction:column;min-width:0}
.chat-title{padding:16px;background:#172b49;font-weight:bold}
#messages{flex:1;min-height:350px;max-height:440px;overflow-y:auto;padding:15px}
.msg{width:fit-content;max-width:85%;padding:12px;border-radius:14px;margin:9px 0;background:#263b58;overflow-wrap:anywhere}
.msg.mine{background:#1769bd;margin-right:auto}
.msg time{display:block;font-size:10px;color:#d4e5f8;margin-top:6px}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-top:8px}
.file-link{display:inline-block;color:#fff;background:#344b6b;padding:9px;border-radius:8px;margin-top:8px;text-decoration:none}
.send{display:flex;gap:8px;padding:12px;background:#14233a;align-items:center}
.send input{margin:0;min-width:0}
.send button{white-space:nowrap}
#status{font-size:12px;color:#ffc76b;text-align:center;padding:8px;overflow-wrap:anywhere}
.header-buttons{display:flex;gap:7px;align-items:center}
.file-label{background:#344b6b;border-radius:10px;padding:12px;cursor:pointer;white-space:nowrap}
#fileInput{display:none}
@media(max-width:650px){
.layout{grid-template-columns:1fr}
.sidebar{border-left:0;border-bottom:1px solid #263954}
#users{display:flex;gap:7px;overflow-x:auto;max-height:none}
.user{min-width:120px}
.app{min-height:90vh}
header{padding:13px}
.send{gap:5px}
.send button,.file-label{padding:11px 10px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div>
  <div class="logo">✦ X CHAT</div>
  <div class="small">پیام‌رسان خصوصی</div>
 </div>
 <div class="header-buttons">
  <button id="notifyBtn" style="background:#344b6b">🔔 فعال‌سازی اعلان</button>
  <button id="logout" style="display:none">خروج</button>
 </div>
</header>

<section id="authArea" class="auth">
<h2>به X Chat خوش آمدی</h2>
<input id="username" placeholder="نام کاربری (برای ثبت‌نام)">
<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)">
<button id="signup">ثبت‌نام</button>
<button id="login" style="background:#344b6b">ورود</button>
<div id="status">برای شروع ثبت‌نام کن یا وارد شو.</div>
</section>

<section id="appArea">
<div class="layout">
<aside class="sidebar">
<h3>👥 کاربران</h3>
<div id="users"></div>
</aside>
<main class="chat">
<div class="chat-title" id="chatTitle">یک کاربر انتخاب کن</div>
<div id="messages"></div>
<div class="send">
<label class="file-label" for="fileInput">📎 فایل</label>
<input id="fileInput" type="file" accept="image/*,.pdf,.txt,.doc,.docx,.zip" disabled>
<input id="messageInput" placeholder="پیامت را بنویس..." disabled>
<button id="sendBtn" disabled>ارسال</button>
</div>
</main>
</div>
</section>
</div>

<script>
const SUPABASE_URL="https://rxjmnlivdtivpknzwwcq.supabase.co";
const SUPABASE_KEY="sb_publishable_DhuXIk2DxDopcgbggz0RDw_qnCHu0aw";
const VAPID_PUBLIC_KEY="BCezDQplrOU_SQHHuoGCub3Krmf7BkI6HYJAGVNI5EMuEYm6QelWLnTLaVeNuqWk1cJVcb3MXtMulGadoRz6RdA";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let currentUser=null;
let selectedUser=null;
let refreshTimer=null;

function status(s){$("status").textContent=s}

function showApp(){
 $("authArea").style.display="none";
 $("appArea").style.display="block";
 $("logout").style.display="block";
}

function showAuth(){
 $("authArea").style.display="block";
 $("appArea").style.display="none";
 $("logout").style.display="none";
}

function urlBase64ToUint8Array(value){
 const padding="=".repeat((4-value.length%4)%4);
 const base64=(value+padding).replace(/-/g,"+").replace(/_/g,"/");
 return Uint8Array.from(atob(base64),c=>c.charCodeAt(0));
}

async function registerServiceWorker(){
 if(!("serviceWorker" in navigator)) throw new Error("Service Worker پشتیبانی نمی‌شود.");
 const registration=await navigator.serviceWorker.register("./service-worker.js");
 await navigator.serviceWorker.ready;
 return registration;
}

async function savePushSubscription(subscription){
 const {error}=await db.from("push_subscriptions").upsert({
  user_id:currentUser.id,
  subscription:subscription.toJSON()
 },{onConflict:"user_id,subscription"});
 if(error) throw error;
}

async function enableNotifications(){
 if(!currentUser){alert("ابتدا وارد حساب شو.");return}
 if(!("Notification" in window)||!("PushManager" in window)){
  alert("مرورگر از اعلان پشتیبانی نمی‌کند.");return;
 }
 if(!window.isSecureContext){alert("سایت باید با HTTPS باز شود.");return}

 try{
  $("notifyBtn").disabled=true;
  const permission=await Notification.requestPermission();
  if(permission!=="granted"){status("مجوز اعلان داده نشد.");return}

  const registration=await registerServiceWorker();
  let subscription=await registration.pushManager.getSubscription();

  if(!subscription){
   subscription=await registration.pushManager.subscribe({
    userVisibleOnly:true,
    applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
   });
  }

  await savePushSubscription(subscription);
  $("notifyBtn").textContent="🔔 اعلان فعال است";
  $("notifyBtn").style.background="#167b55";
  status("اعلان‌ها فعال شدند.");
 }catch(error){
  console.error(error);
  status("خطا در اعلان: "+error.message);
 }finally{
  $("notifyBtn").disabled=false;
 }
}
$("notifyBtn").onclick=enableNotifications;

async function ensureProfile(user){
 const username=(user.user_metadata?.username||user.email.split("@")[0]).trim().slice(0,30);
 const {error}=await db.from("profiles").upsert(
  {id:user.id,username},
  {onConflict:"id",ignoreDuplicates:true}
 );
 if(error) throw error;
}

async function loadUsers(){
 const {data,error}=await db.from("profiles")
  .select("id,username")
  .neq("id",currentUser.id)
  .order("username");

 if(error){status("خطا در دریافت کاربران: "+error.message);return}
 $("users").innerHTML="";

 (data||[]).forEach(user=>{
  const el=document.createElement("div");
  el.className="user"+(selectedUser?.id===user.id?" active":"");
  el.textContent="👤 "+user.username;
  el.onclick=async()=>{
   selectedUser=user;
   $("chatTitle").textContent="چت با "+user.username;
   $("messageInput").disabled=false;
   $("sendBtn").disabled=false;
   $("fileInput").disabled=false;
   await loadUsers();
   await loadMessages();
  };
  $("users").appendChild(el);
 });
}

/* نمایش پیام و فایل */

async function loadMessages(){
 if(!selectedUser||!currentUser)return;

 const box=$("messages");
 const a=currentUser.id;
 const b=selectedUser.id;

 const {data,error}=await db.from("messages")
  .select("id,sender_id,receiver_id,content,created_at,message_type,media_url")
  .or(`and(sender_id.eq.${a},receiver_id.eq.${b}),and(sender_id.eq.${b},receiver_id.eq.${a})`)
  .order("created_at",{ascending:true})
  .limit(200);

 if(error){
  status("خطا در دریافت پیام‌ها: "+error.message);
  return;
 }

 const messages=data||[];

 const signature=b+":"+JSON.stringify(
  messages.map(m=>[
   m.id,m.content,m.media_url,m.message_type,m.created_at
  ])
 );

 // اگر پیام‌ها تغییری نکرده‌اند، صفحه را دوباره نساز
 if(box.dataset.signature===signature)return;

 const wasAtBottom=
  box.scrollHeight-box.scrollTop-box.clientHeight<80;

 const fragment=document.createDocumentFragment();

 for(const m of messages){
  const el=document.createElement("div");
  el.className="msg"+(m.sender_id===currentUser.id?" mine":"");

  if(m.content){
   const content=document.createElement("div");
   content.textContent=m.content;
   el.appendChild(content);
  }

  if(m.media_url){
   const {data:fileData,error:fileError}=await db.storage
    .from("chat-media")
    .createSignedUrl(m.media_url,3600);

   if(!fileError&&fileData?.signedUrl){
    if(m.message_type==="image"){
     const img=document.createElement("img");
     img.src=fileData.signedUrl;
     img.alt="تصویر ارسال‌شده";
     img.loading="lazy";
     el.appendChild(img);
    }else{
     const link=document.createElement("a");
     link.href=fileData.signedUrl;
     link.target="_blank";
     link.rel="noopener noreferrer";
     link.className="file-link";
     link.textContent="📎 دریافت فایل";
     el.appendChild(link);
    }
   }else{
    const errorText=document.createElement("div");
    errorText.textContent="فایل در دسترس نیست.";
    el.appendChild(errorText);
   }
  }

  const time=document.createElement("time");
  time.textContent=new Date(m.created_at).toLocaleString("fa-IR");
  el.appendChild(time);

  fragment.appendChild(el);
 }

 box.replaceChildren(fragment);
 box.dataset.signature=signature;

 if(wasAtBottom){
  box.scrollTop=box.scrollHeight;
 }
}

/* آپلود فایل در باکت خصوصی */
async function uploadFile(file){
 if(!currentUser)throw new Error("ابتدا وارد حساب شو.");
 if(file.size>10*1024*1024)throw new Error("حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.");

 const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path=currentUser.id+"/"+crypto.randomUUID()+"_"+safeName;

 const {error}=await db.storage.from("chat-media").upload(path,file,{
  cacheControl:"3600",
  upsert:false,
  contentType:file.type||"application/octet-stream"
 });

 if(error)throw error;
 return path;
}

async function sendMessage(){
 if(!selectedUser||!currentUser)return;

 const content=$("messageInput").value.trim();
 const file=$("fileInput").files[0];

 if(!content&&!file)return;

 $("sendBtn").disabled=true;
 $("fileInput").disabled=true;

 try{
  let mediaUrl=null;
  let messageType="text";

  if(file){
   status("در حال آپلود فایل...");
   mediaUrl=await uploadFile(file);
   messageType=file.type.startsWith("image/")?"image":"file";
  }

  status("در حال ارسال پیام...");

  const {data:message,error}=await db.from("messages").insert({
   sender_id:currentUser.id,
   receiver_id:selectedUser.id,
   content,
   message_type:messageType,
   media_url:mediaUrl
  }).select("id").single();

  if(error)throw error;

  $("messageInput").value="";
  $("fileInput").value="";
  await loadMessages();

  /* درخواست اعلان */
  try{
   const {error:pushError}=await db.functions.invoke("send-push",{
    body:{message_id:message.id}
   });
   if(pushError)console.error("Push error:",pushError);
  }catch(pushError){
   console.error(pushError);
  }

  status("پیام با موفقیت ارسال شد.");
 }catch(error){
  console.error(error);
  status("خطا در ارسال: "+error.message);
 }finally{
  $("sendBtn").disabled=false;
  $("fileInput").disabled=false;
 }
}

async function startApp(user){
 try{
  currentUser=user;
  await ensureProfile(user);
  showApp();
  await loadUsers();

  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{
   loadUsers();
   if(selectedUser)loadMessages();
  },5000);

  try{
   const registration=await registerServiceWorker();
   const subscription=await registration.pushManager.getSubscription();
   if(subscription&&Notification.permission==="granted"){
    await savePushSubscription(subscription);
    $("notifyBtn").textContent="🔔 اعلان فعال است";
    $("notifyBtn").style.background="#167b55";
   }
  }catch(error){console.log("Push setup:",error.message)}
 }catch(error){
  showAuth();
  status("خطا در آماده‌سازی حساب: "+error.message);
 }
}

$("signup").onclick=async()=>{
 const username=$("username").value.trim();
 const email=$("email").value.trim();
 const password=$("password").value;

 if(!username||username.length>30||!email||password.length<6){
  status("نام کاربری، ایمیل و رمز حداقل ۶ حرف را وارد کن.");
  return;
 }

 status("در حال ثبت‌نام...");
 const {data,error}=await db.auth.signUp({
  email,password,options:{data:{username}}
 });

 if(error){status("خطا: "+error.message);return}
 if(!data.session){
  status("ثبت‌نام شد. ایمیلت را تأیید کن و سپس وارد شو.");
  return;
 }
 await startApp(data.user);
};

$("login").onclick=async()=>{
 const email=$("email").value.trim();
 const password=$("password").value;
 status("در حال ورود...");

 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error){status("خطا در ورود: "+error.message);return}
 await startApp(data.user);
};

$("sendBtn").onclick=sendMessage;
$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

$("fileInput").addEventListener("change",()=>{
 const file=$("fileInput").files[0];
 if(file)status("فایل انتخاب شد: "+file.name);
});

$("logout").onclick=async()=>{
 if(refreshTimer)clearInterval(refreshTimer);
 await db.auth.signOut();
 currentUser=null;
 selectedUser=null;
 $("messages").innerHTML="";
 $("users").innerHTML="";
 $("messageInput").disabled=true;
 $("sendBtn").disabled=true;
 $("fileInput").disabled=true;
 $("notifyBtn").textContent="🔔 فعال‌سازی اعلان";
 $("notifyBtn").style.background="#344b6b";
 showAuth();
 status("از حساب خارج شدی.");
};

(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session)await startApp(data.session.user);
})();
</script>
</body>
</html>
